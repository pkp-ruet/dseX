name: Daily DSE Scrape

on:
  # Scheduling is owned by cron-job.org, which calls GitHub's workflow_dispatch
  # API on time. The native `schedule:` trigger was chronically delayed because it
  # fired at the top of the hour (GitHub's busiest, best-effort window).
  # Targets (UTC), Dhaka = UTC+6:
  #   Sun,Mon,Tue,Thu 09:00 -> dispatch inputs.full=false  (daily, 3:00 PM BD)
  #   Wed             09:00 -> dispatch inputs.full=true    (weekly full)
  # Revert to native cron with:
  #   schedule: [{ cron: "0 9 * * 0-4" }, { cron: "0 9 * * 3" }]
  workflow_dispatch:
    inputs:
      full:
        description: "Run full scrape (all companies including unscored)"
        type: boolean
        default: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    env:
      MONGODB_URI: ${{ secrets.MONGODB_URI }}
      MONGODB_DB_NAME: ${{ secrets.MONGODB_DB_NAME }}
      FRONTEND_REVALIDATE_URL: ${{ secrets.FRONTEND_REVALIDATE_URL }}
      REVALIDATE_SECRET: ${{ secrets.REVALIDATE_SECRET }}
      VERCEL_DEPLOY_HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
      # Web push (event alerts). Same VAPID keypair as the Render backend.
      VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
      VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
      VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scrapers
        run: |
          if [ "${{ github.event.inputs.full }}" = "true" ]; then
            echo "Running FULL scrape (all companies)..."
            python main.py scrape-all --full
          else
            echo "Running daily scrape (scored companies only)..."
            python main.py scrape-all
          fi

      # Dividend + 52-week-extreme push alerts, once news/dividends are fresh.
      # No-op until the VAPID secrets are set; idempotent per event per day; a
      # failure here must not fail the scrape.
      - name: Send push event alerts
        if: ${{ success() }}
        continue-on-error: true
        run: python main.py notify-events
