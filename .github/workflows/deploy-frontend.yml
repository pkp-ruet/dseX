name: Deploy frontend (Cloudflare)

# The Next.js frontend runs on a Cloudflare Worker (OpenNext adapter) since
# 2026-11-10; it left Vercel when the Hobby plan paused the site.
# Builds on Linux (OpenNext doesn't fully support Windows) and deploys.
# Setup steps and the secrets it needs: frontend/CLOUDFLARE.md.
#
# Runs only by hand (2026-11-12, user decision: both deploys are manual).
# When a change needs new backend endpoints, deploy the backend on Render
# first, wait until it is Live, then run this.

on:
  workflow_dispatch:

concurrency:
  group: deploy-frontend
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # Read at build time (NEXT_PUBLIC_* are baked into the browser code).
      API_URL: https://dsex.onrender.com
      NEXT_PUBLIC_API_URL: https://dsex.onrender.com
      NEXT_PUBLIC_BASE_URL: https://www.topstockbd.com
      NEXT_PUBLIC_GA_ID: ${{ secrets.NEXT_PUBLIC_GA_ID }}
      NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${{ secrets.NEXT_PUBLIC_GOOGLE_CLIENT_ID }}
      NEXT_PUBLIC_VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
      # Lets the build's backend requests skip the per-address rate limits.
      REVALIDATE_SECRET: ${{ secrets.REVALIDATE_SECRET }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      # Wake the Render backend and fill its caches first. The build gives each
      # backend read 30 s (lib/api.ts API_TIMEOUT_MS) and a page whose main
      # read fails stops the build. Right after a backend deploy the caches
      # are empty and /api/market/state alone took over 30 s (2026-11-13,
      # /dse-today failed the build), so call the slow ones here first, with
      # no time limit that matters, all at once.
      - name: Wake the backend
        run: |
          B=https://dsex.onrender.com
          curl -s -o /dev/null -m 120 "$B/health" || true
          for p in /api/scores /api/market/state /api/dse-today \
                   /api/dividend-calendar /api/sectors /api/screener \
                   /api/buy-list /api/results /api/rankings/today \
                   /api/research/summary; do
            curl -s -o /dev/null -m 240 -w "$p %{http_code} %{time_total}s\n" "$B$p" &
          done
          wait

      - run: npm run deploy
