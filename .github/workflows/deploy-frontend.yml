name: Deploy frontend (Cloudflare)

# The Next.js frontend runs on a Cloudflare Worker (OpenNext adapter) since
# 2026-11-10; it left Vercel when the Hobby plan paused the site.
# Builds on Linux (OpenNext doesn't fully support Windows) and deploys.
# Setup steps and the secrets it needs: frontend/CLOUDFLARE.md.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/deploy-frontend.yml"

concurrency:
  group: deploy-frontend
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # Read at build time (NEXT_PUBLIC_* are baked into the browser code).
      API_URL: https://dsex.onrender.com
      NEXT_PUBLIC_API_URL: https://dsex.onrender.com
      NEXT_PUBLIC_BASE_URL: https://www.topstockbd.com
      NEXT_PUBLIC_GA_ID: ${{ secrets.NEXT_PUBLIC_GA_ID }}
      NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${{ secrets.NEXT_PUBLIC_GOOGLE_CLIENT_ID }}
      NEXT_PUBLIC_VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
      # Lets the build's backend requests skip the per-address rate limits.
      REVALIDATE_SECRET: ${{ secrets.REVALIDATE_SECRET }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history, so the wait step can tell whether the live backend
          # already runs this commit or a later one.
          fetch-depth: 0

      # The build reads the backend, and new pages throw without their
      # endpoints. When this push also changed backend code, wait until
      # Render runs it (/health reports RENDER_GIT_COMMIT) before building.
      - name: Wait for the backend to deploy this push
        working-directory: .
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          set -u
          if [ -z "${BEFORE}" ] || [ "${BEFORE}" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            echo "Started by hand (or no earlier commit to compare): not waiting."
            exit 0
          fi
          CHANGED=$(git diff --name-only "${BEFORE}" "${GITHUB_SHA}" \
            | grep -vE '^(frontend/|\.github/|docs/)|\.md$' || true)
          if [ -z "${CHANGED}" ]; then
            echo "This push changed no backend code: not waiting."
            exit 0
          fi
          echo "Backend files in this push:"; echo "${CHANGED}" | head -20
          for i in $(seq 1 75); do
            LIVE=$(curl -s -m 60 https://dsex.onrender.com/health \
              | python3 -c 'import sys,json; print(json.load(sys.stdin).get("commit") or "")' 2>/dev/null || true)
            if [ -n "${LIVE}" ] && git cat-file -e "${LIVE}^{commit}" 2>/dev/null \
               && git merge-base --is-ancestor "${GITHUB_SHA}" "${LIVE}"; then
              echo "The backend runs ${LIVE}: building the frontend now."
              exit 0
            fi
            echo "Waiting for Render to deploy ${GITHUB_SHA:0:7} (live: ${LIVE:0:7}) …"
            sleep 20
          done
          echo "::error::The backend did not deploy ${GITHUB_SHA:0:7} within 25 minutes. Check Render, then re-run this job."
          exit 1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      # Wake the Render backend first: the build reads it, and a cold free
      # instance can take a minute to answer.
      - name: Wake the backend
        run: curl -s -o /dev/null -m 120 https://dsex.onrender.com/health || true

      - run: npm run deploy
