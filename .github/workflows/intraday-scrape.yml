name: Intraday DSE Scrape

on:
  schedule:
    # Every 5 min, Sun-Thu, 04:00-09:30 UTC = 10:00-15:30 BST
    # In-script is_intraday_scrape_window() guard handles boundary minutes
    # (window extends 60 min past 14:30 close to capture final prints).
    - cron: "*/5 4-8 * * 0-4"
    - cron: "0,5,10,15,20,25,30 9 * * 0-4"
  workflow_dispatch:
    inputs:
      force:
        description: "Run even if the market is closed (for testing)"
        type: boolean
        default: false

concurrency:
  group: intraday-scrape
  cancel-in-progress: true

jobs:
  scrape:
    runs-on: ubuntu-latest
    env:
      MONGODB_URI: ${{ secrets.MONGODB_URI }}
      MONGODB_DB_NAME: ${{ secrets.MONGODB_DB_NAME }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run intraday scrape
        run: |
          if [ "${{ github.event.inputs.force }}" = "true" ]; then
            python main.py scrape-intraday --force
          else
            python main.py scrape-intraday
          fi
