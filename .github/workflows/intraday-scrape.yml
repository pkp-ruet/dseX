name: Intraday DSE Scrape

on:
  schedule:
    # 8 ticks/trading-day at 10:30, 11, 11:30, 12, 12:30, 13, 13:30, 14:00 BST
    # BST = UTC+6, Sun-Thu (cron weekday 0-4). All ticks fall inside the
    # is_intraday_scrape_window() guard at main.py:180.
    - cron: "30 4 * * 0-4"          # 10:30 BST
    - cron: "0,30 5 * * 0-4"        # 11:00, 11:30 BST
    - cron: "0,30 6 * * 0-4"        # 12:00, 12:30 BST
    - cron: "0,30 7 * * 0-4"        # 13:00, 13:30 BST
    - cron: "0 8 * * 0-4"           # 14:00 BST
  workflow_dispatch:
    inputs:
      force:
        description: "Run even if the market is closed (for testing)"
        type: boolean
        default: false

concurrency:
  group: intraday-scrape
  cancel-in-progress: true

jobs:
  scrape:
    runs-on: ubuntu-latest
    env:
      MONGODB_URI: ${{ secrets.MONGODB_URI }}
      MONGODB_DB_NAME: ${{ secrets.MONGODB_DB_NAME }}
      FRONTEND_REVALIDATE_URL: ${{ secrets.FRONTEND_REVALIDATE_URL }}
      REVALIDATE_SECRET: ${{ secrets.REVALIDATE_SECRET }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run intraday scrape
        run: |
          if [ "${{ github.event.inputs.force }}" = "true" ]; then
            python main.py scrape-intraday --force
          else
            python main.py scrape-intraday
          fi
