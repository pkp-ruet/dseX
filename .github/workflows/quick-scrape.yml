name: Quick DSE Close Update

on:
  # Scheduling is owned by cron-job.org, which calls GitHub's workflow_dispatch
  # API on time. The native `schedule:` trigger was chronically delayed because it
  # fired at the top of the hour (GitHub's busiest, best-effort window).
  # Target: Sun-Thu 08:00 UTC = 2:00 PM Dhaka (market close) — latest prices +
  # market summary, then purge the ISR cache so price/index/market-analysis views
  # update everywhere. Heavy fundamentals stay on daily-scrape.yml.
  # Revert to native cron with:  schedule: [{ cron: "0 8 * * 0-4" }]
  workflow_dispatch:

concurrency:
  group: quick-scrape
  cancel-in-progress: true

jobs:
  quick:
    runs-on: ubuntu-latest
    env:
      MONGODB_URI: ${{ secrets.MONGODB_URI }}
      MONGODB_DB_NAME: ${{ secrets.MONGODB_DB_NAME }}
      FRONTEND_REVALIDATE_URL: ${{ secrets.FRONTEND_REVALIDATE_URL }}
      REVALIDATE_SECRET: ${{ secrets.REVALIDATE_SECRET }}
      # Web push (daily digest). Same VAPID keypair as the Render backend; the
      # PUBLIC key must also match NEXT_PUBLIC_VAPID_PUBLIC_KEY on Vercel.
      VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
      VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
      VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run quick close update
        run: python main.py scrape-quick

      # Daily "your stocks today" push, right after fresh prices land. No-op until
      # the VAPID secrets are set, and idempotent per Dhaka day, so this is safe
      # even if the job re-runs. A failure here must not fail the price refresh.
      - name: Send daily push digest
        if: ${{ success() }}
        continue-on-error: true
        run: python main.py notify-digest
