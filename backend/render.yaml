services:
  - type: web
    name: dsex-api
    env: python
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT --workers 1
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB_NAME
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      # glibc gives every thread its own malloc arena; a threaded Python server
      # then holds far more RSS than it uses. Two arenas is the usual cure.
      - key: MALLOC_ARENA_MAX
        value: "2"
      - key: THREADPOOL_SIZE
        value: "20"
